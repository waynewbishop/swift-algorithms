<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% seo %}

  <script>
    // Apply the reader's saved theme before the page paints; light is the default.
    try { if (localStorage.getItem('fn-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/field-notes.css' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
  <link rel="icon" type="image/png" sizes="48x48" href="{{ '/assets/images/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">

  {% if include.kind == "home" %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Book",
    "name": "Swift Algorithms & Data Structures",
    "bookEdition": "5th Edition",
    "author": { "@type": "Person", "name": "Wayne Bishop", "url": "https://www.linkedin.com/in/waynebishop/" },
    "description": {{ site.description | jsonify }},
    "inLanguage": "en",
    "genre": "Computer Science",
    "url": "{{ site.url }}{{ site.baseurl }}/"
  }
  </script>
  {% else %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Chapter",
    "name": {{ page.title | jsonify }},
    "description": {{ page.description | jsonify }},
    "isPartOf": {
      "@type": "Book",
      "name": "Swift Algorithms & Data Structures",
      "author": { "@type": "Person", "name": "Wayne Bishop" },
      "bookEdition": "5th Edition",
      "inLanguage": "en",
      "genre": "Computer Science"
    },
    "author": { "@type": "Person", "name": "Wayne Bishop" },
    "url": "{{ page.url | absolute_url }}"
  }
  </script>
  {% endif %}
</head>
