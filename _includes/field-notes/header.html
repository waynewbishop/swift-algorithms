<header class="fn-header">
  {% unless include.home %}
  <button class="fn-menu-button" type="button" aria-controls="fn-sidebar" aria-expanded="false" aria-label="Show chapters">
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  {% endunless %}

  <a class="fn-brand" href="{{ '/' | relative_url }}">
    <svg aria-hidden="true" width="30" height="30" viewBox="0 0 32 32"><path d="M3 27 L12 10 L18 19 L23 12 L29 27" fill="none" stroke="var(--granite)" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="10" r="3.5" fill="var(--bg)" stroke="var(--glacier)" stroke-width="2"/><circle cx="23" cy="12" r="3" fill="var(--bg)" stroke="var(--fir)" stroke-width="2"/><circle cx="18" cy="19" r="2.6" fill="var(--rooibos)"/></svg>
    <span class="fn-brand-name">Swift Algorithms</span>
    <span class="fn-edition">5th edition</span>
  </a>

  <nav class="fn-site-nav" aria-label="Site">
    <a href="{{ '/' | relative_url }}"{% if include.home %} aria-current="page"{% endif %}>Contents</a>
    <a href="https://waynewbishop.github.io/quiver/documentation/quiver/" target="_blank" rel="noopener">Quiver</a>
    <a href="https://github.com/waynewbishop/bishop-algorithms-swift-package" target="_blank" rel="noopener">Structures package</a>
    <a href="https://github.com/waynewbishop/swift-algorithms" target="_blank" rel="noopener">GitHub</a>
  </nav>

  <button class="fn-theme-button" type="button" aria-pressed="false" aria-label="Dark theme">
    <svg class="fn-icon-moon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    <svg class="fn-icon-sun" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>
